<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Tic Tac Toe</h1>

  <div id="mode-screen">
    <p>Choose a game mode:</p>
    <button onclick="import('./game.js').then(m => m.selectMode('ai'))">Play vs AI</button>
    <button onclick="import('./game.js').then(m => m.selectMode('2player'))">Play vs Friend</button>
  </div>

  <div id="game-screen" class="hidden">
    <p id="status"></p>
    <div id="board">
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
    </div>
    <button id="restart" onclick="import('./game.js').then(m => m.restart())">Restart</button>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
