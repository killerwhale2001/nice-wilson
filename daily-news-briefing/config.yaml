# Daily News Briefing Configuration
# Secrets (API keys, passwords) must be set as environment variables — never hardcode them here.
# See README.md for setup instructions.

# ── NewsAPI ──────────────────────────────────────────────────────────────────
newsapi:
  enabled: true
  # api_key: set via NEWS_API_KEY environment variable

  categories:
    - name: "Technology"
      category: "technology"
      max_articles: 3
      enabled: true
    - name: "Business"
      category: "business"
      max_articles: 3
      enabled: true
    - name: "Science"
      category: "science"
      max_articles: 2
      enabled: false
    - name: "Health"
      category: "health"
      max_articles: 2
      enabled: false

  keywords:
    - query: "artificial intelligence"
      category: "AI & Technology"
      max_articles: 3
      enabled: true
    - query: "stock market trading"
      category: "Finance"
      max_articles: 3
      enabled: true
    - query: "machine learning"
      category: "AI & Technology"
      max_articles: 2
      enabled: true

  # NOTE: NewsAPI free tier source-based fetching returns stale/old articles.
  # All sources below are disabled — fresh content is covered by web scraping instead.
  # Re-enable only if you upgrade to a paid NewsAPI plan.
  sources:
    - name: "TechCrunch"
      source_id: "techcrunch"
      category: "Technology"
      max_articles: 3
      enabled: false
    - name: "Wired"
      source_id: "wired"
      category: "AI & Technology"
      max_articles: 3
      enabled: false
    - name: "Engadget"
      source_id: "engadget"
      category: "Technology"
      max_articles: 3
      enabled: false
    - name: "The Verge"
      source_id: "the-verge"
      category: "Technology"
      max_articles: 3
      enabled: false
    - name: "Business Insider"
      source_id: "business-insider"
      category: "Business"
      max_articles: 3
      enabled: false
    - name: "Fortune"
      source_id: "fortune"
      category: "Finance"
      max_articles: 3
      enabled: false
    - name: "BBC News"
      source_id: "bbc-news"
      category: "World"
      max_articles: 2
      enabled: false
    - name: "USA Today"
      source_id: "usa-today"
      category: "General"
      max_articles: 2
      enabled: false
    - name: "Associated Press"
      source_id: "associated-press"
      category: "World"
      max_articles: 3
      enabled: false

# ── Web Scraping Sources ──────────────────────────────────────────────────────
news_sources:
  - name: "VentureBeat"
    url: "https://venturebeat.com"
    category: "Technology"
    max_articles: 3
    enabled: true
  - name: "Ars Technica"
    url: "https://arstechnica.com"
    category: "Technology"
    max_articles: 3
    enabled: true
  - name: "9to5Mac"
    url: "https://9to5mac.com"
    category: "Apple"
    max_articles: 3
    enabled: true
  - name: "Electrek"
    url: "https://electrek.co"
    category: "Tesla & EV"
    max_articles: 3
    enabled: true

# ── AI Analysis ───────────────────────────────────────────────────────────────
ai_analysis:
  enabled: true
  use_enhanced: true          # true = CEO executive briefing format, false = basic summary
  model: "gpt-4o-mini"        # or "gpt-4o" for higher quality (higher cost)
  temperature: 0.4            # lower = more precise, less creative
  max_tokens: 600
  analysis_style: "executive"
  focus_areas:
    - "competitive dynamics among Apple, Google, Microsoft, Meta, Amazon, NVIDIA"
    - "AI and technology strategy"
    - "regulatory and antitrust risk"
    - "market and investor signals"
  custom_instructions: |
    This briefing goes directly to the CEO of a top technology company.
    Every analysis must answer: what does this mean for our strategy and competitive position?
    Flag anything requiring executive decision or response.
    Always identify relevant stock tickers and direction (bullish/bearish).
  # api_key: set via OPENAI_API_KEY environment variable

# ── Email Delivery ────────────────────────────────────────────────────────────
email_delivery:
  enabled: true
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  sender_name: "News Briefing Bot"
  # sender_email: set via EMAIL_ADDRESS environment variable
  # sender_password: set via EMAIL_PASSWORD environment variable (use Gmail App Password)
  recipients:
    - "huipeng@gmail.com"
    - "zoeliu@gmail.com"
    - "andrew.w.peng@gmail.com"
    - "alex.lele.peng@gmail.com"
  html_format: true
  include_attachment: true  # attach the .md report file

# ── Content Filtering ─────────────────────────────────────────────────────────
content_filter:
  enabled: true
  case_sensitive: false
  include_keywords:
    - "AI"
    - "machine learning"
    - "artificial intelligence"
    - "neural networks"
    - "deep learning"
    - "stock market"
    - "trading"
    - "S&P 500"
    - "investment"
    - "portfolio"
    - "iPhone"
    - "OpenAI"
    - "Tesla"
    - "technology"
  exclude_keywords: []   # add terms to block here (e.g. "sponsored", "advertisement")

# ── News Ranking ──────────────────────────────────────────────────────────────
news_ranking:
  enabled: true
  top_n: 10           # max articles in final report
  min_score: 60       # articles below this score are dropped
  model: "gpt-4o-mini"
  ranking_criteria:
    - "global impact"
    - "business significance"
    - "technological innovation"
    - "market relevance"
    - "urgency and timeliness"
  user_interests:
    - "AI and machine learning"
    - "stock market and investing"
    - "consumer technology (Apple, Tesla)"
    - "startup ecosystem"

# ── Twitter/X Integration ─────────────────────────────────────────────────────
x_twitter:
  enabled: true
  # nitter_instance: "https://nitter.net"   # optional: force a specific instance

  # Note: nitter.net RSS feeds are capped at 20 tweets per account regardless of max_tweets
  accounts:
    - username: "elonmusk"
      display_name: "Elon Musk"
      category: "Tech Leaders & Tesla"
      max_tweets: 20
      exclude_replies: false
      exclude_retweets: false
      enabled: true
    - username: "sama"
      display_name: "Sam Altman"
      category: "AI Leaders"
      max_tweets: 20
      exclude_replies: true
      exclude_retweets: true
      enabled: true
    - username: "karpathy"
      display_name: "Andrej Karpathy"
      category: "AI Leaders"
      max_tweets: 20
      exclude_replies: true
      exclude_retweets: true
      enabled: true
    - username: "ylecun"
      display_name: "Yann LeCun"
      category: "AI Leaders"
      max_tweets: 20
      exclude_replies: true
      exclude_retweets: true
      enabled: true
    - username: "gdb"
      display_name: "Greg Brockman"
      category: "AI Leaders"
      max_tweets: 20
      exclude_replies: true
      exclude_retweets: true
      enabled: true
    - username: "chamath"
      display_name: "Chamath Palihapitiya"
      category: "Finance & Investing"
      max_tweets: 20
      exclude_replies: true
      exclude_retweets: false
      enabled: true
    - username: "naval"
      display_name: "Naval Ravikant"
      category: "Finance & Investing"
      max_tweets: 20
      exclude_replies: true
      exclude_retweets: false
      enabled: true
    - username: "tim_cook"
      display_name: "Tim Cook"
      category: "Apple"
      max_tweets: 20
      exclude_replies: false
      exclude_retweets: false
      enabled: true
    - username: "gruber"
      display_name: "John Gruber"
      category: "Apple"
      max_tweets: 20
      exclude_replies: true
      exclude_retweets: false
      enabled: true
    - username: "TroyTeslike"
      display_name: "Troy Teslike"
      category: "Tech Leaders & Tesla"
      max_tweets: 20
      exclude_replies: true
      exclude_retweets: false
      enabled: true
    - username: "GergelyOrosz"
      display_name: "Gergely Orosz"
      category: "Tech"
      max_tweets: 20
      exclude_replies: true
      exclude_retweets: false
      enabled: false

  summarization:
    enabled: true
    model: "gpt-4o-mini"
    focus_areas:
      - "AI and technology"
      - "business and investing"
      - "Tesla and electric vehicles"
      - "Apple products and strategy"

# ── Scheduling ────────────────────────────────────────────────────────────────
schedule:
  time: "07:00"                      # 24-hour format, America/Los_Angeles timezone
  timezone: "America/Los_Angeles"

# ── Output ────────────────────────────────────────────────────────────────────
output:
  reports_folder: "reports"
  logs_folder: "logs"
  report_format: "markdown"
  filename_pattern: "news_briefing_{date}.md"

# ── Error Handling ────────────────────────────────────────────────────────────
error_handling:
  retry_attempts: 3
  retry_delay: 5        # seconds between retries
  continue_on_error: true   # keep going if one pipeline stage fails
